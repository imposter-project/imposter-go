project_name: imposter-go

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X github.com/imposter-project/imposter-go/internal/version.Version={{.Version}}
    main: ./cmd/imposter
    tags:
      - lambda.norpc

archives:
  - format: tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- tolower .Os }}_
      {{- .Arch }}
    format_overrides:
      - goos: windows
        format: zip

changelog:
  sort: asc
  filters:
    exclude:
      - Merge pull request
      - Merge branch
      - "build: release"

checksum:
  name_template: 'checksums.txt'

snapshot:
  name_template: "{{ incpatch .Version }}-next"

# The release body is supplied by CI via `--release-notes`, built from the
# CHANGELOG.md entries for the tag (see the release job in .github/workflows/ci.yml).
# GoReleaser skips its own changelog, header and footer when release notes are
# passed in, so that content lives alongside the extract step in the workflow.
release:
  github:
    owner: imposter-project
    name: imposter-go
  draft: false
  prerelease: auto
  mode: replace 